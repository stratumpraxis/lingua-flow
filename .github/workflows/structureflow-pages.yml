name: Deploy Structureflow English GAME

on:
  push:
    branches: [main]
    paths:
      - "structureflow-english/**"
      - ".github/workflows/structureflow-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: structureflow-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: structureflow-english
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
